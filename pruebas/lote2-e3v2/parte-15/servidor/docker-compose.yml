name: caso1v2e3

# Parte 15 · despliegue en servidor con 2 GPU de 96 GB (RTX PRO 6000 Blackwell).
# Imágenes por digest y modelos por revisión. Sin variables = modelo VL de la
# Parte 14 (Qwen2.5-VL-7B). VL_MODELO / VL_REV cambian el modelo de visión;
# ver modelos-vl.env y DESPLIEGUE.md.
# Rutas del host: DATA_HOST (formularios, default /data/e3) y HF_HOST (pesos,
# default /data/hf-cache). Ver DESPLIEGUE.md.

x-app-env: &app-env
  RABBIT_URL: amqp://guest:guest@rabbitmq:5672/?heartbeat=600&blocked_connection_timeout=300
  DATA_DIR: /data/e3
  VLLM_URL: http://vllm:8000/v1
  VLLM_VL_URL: http://vllm-vl:8000/v1
  VLLM_VL_MODEL: ${VL_MODELO:-Qwen/Qwen2.5-VL-7B-Instruct}
  NLP_MODEL: Qwen/Qwen2.5-7B-Instruct-AWQ
  LEER_LOGPROBS: ${LEER_LOGPROBS:-1}
  LP_MARCAR: ${LP_MARCAR:-1}
  LP_UMBRAL: ${LP_UMBRAL:-50}
  LP_UMBRALES: ${LP_UMBRALES:-}
  LP_GUARDAR: ${LP_GUARDAR:-0}
  DIR_NORMALIZAR: ${DIR_NORMALIZAR:-1}
  LEER_CONTACTO: ${LEER_CONTACTO:-0}
  LEER_APELLIDO: ${LEER_APELLIDO:-0}

services:
  # ═══════════════════════════════════════════════════════════
  #  RABBITMQ - Gestor de colas
  # ═══════════════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3.13-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: caso1v2e3e3-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    volumes:
      - rabbit-data:/var/lib/rabbitmq

  # ═══════════════════════════════════════════════════════════
  #  VLLM - GPU 1 - NLP Model (Qwen2.5-7B-Instruct-AWQ)
  # ═══════════════════════════════════════════════════════════
  vllm:
    image: vllm/vllm-openai@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1
    container_name: caso1v2e3e3-vllm-nlp
    runtime: nvidia
    ipc: host
    ports:
      - "8000:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${HF_HOST:-/data/hf-cache}:/root/.cache/huggingface
    command:
      - --model
      - Qwen/Qwen2.5-7B-Instruct-AWQ
      - --revision
      - b25037543e9394b818fdfca67ab2a00ecc7dd641
      - --tokenizer-revision
      - b25037543e9394b818fdfca67ab2a00ecc7dd641
      - --gpu-memory-utilization
      - "0.40"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "32"
      - --enforce-eager
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  # ═══════════════════════════════════════════════════════════
  #  VLLM-VL - GPU 0 - Vision Model (Qwen2.5-VL-7B-Instruct)
  # ═══════════════════════════════════════════════════════════
  vllm-vl:
    image: vllm/vllm-openai@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1
    container_name: caso1v2e3e3-vllm-vl
    runtime: nvidia
    ipc: host
    ports:
      - "8001:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${HF_HOST:-/data/hf-cache}:/root/.cache/huggingface
    command:
      - --model
      - ${VL_MODELO:-Qwen/Qwen2.5-VL-7B-Instruct}
      - --revision
      - ${VL_REV:-cc594898137f460bfe9f0759e9844b3ce807cfb5}
      - --tokenizer-revision
      - ${VL_REV:-cc594898137f460bfe9f0759e9844b3ce807cfb5}
      - --gpu-memory-utilization
      - "${VL_MEM:-0.90}"
      - --max-model-len
      - "${VL_MAXLEN:-16384}"
      - --${VL_EAGER:-enforce-eager}
      - --max-num-seqs
      - "${VL_SEQS:-8}"
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  # ═══════════════════════════════════════════════════════════
  #  OCR WORKERS - 8 workers (CPU/GPU 0)
  # ═══════════════════════════════════════════════════════════
  ocr:
    image: python:3.11-slim@sha256:bab1b7ef4b450c81002278d035eff85ebe394ae94df904f7a3ba14f7e16e487b
    container_name: caso1v2e3e3-ocr
    depends_on:
      rabbitmq:
        condition: service_healthy
      vllm-vl:
        condition: service_started
    environment:
      <<: *app-env
    volumes:
      - ./workers:/app
      - ${DATA_HOST:-/data/e3}:/data/e3:ro
    working_dir: /app
    command: >
      bash -c "
        pip install -q -r requirements.txt &&
        for i in $$(seq 1 ${OCR_WORKERS:-8}); do
          python -u ocr_worker.py &
        done &&
        wait
      "
    restart: unless-stopped
    deploy:
      replicas: 1

  # ═══════════════════════════════════════════════════════════
  #  Perfil "doble": segunda copia del VL en GPU 1, junto al NLP
  #  (que usa 40 % de esa GPU y casi nada de cómputo), con sus
  #  propios workers OCR sobre la misma cola ocr_input.
  #  Activar: COMPOSE_PROFILES=doble (ver modelos/*-doble.env).
  # ═══════════════════════════════════════════════════════════
  vllm-vl2:
    image: vllm/vllm-openai@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1
    container_name: caso1v2e3e3-vllm-vl2
    profiles: ["doble"]
    runtime: nvidia
    ipc: host
    ports:
      - "8002:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${HF_HOST:-/data/hf-cache}:/root/.cache/huggingface
    command:
      - --model
      - ${VL_MODELO:-Qwen/Qwen2.5-VL-7B-Instruct}
      - --revision
      - ${VL_REV:-cc594898137f460bfe9f0759e9844b3ce807cfb5}
      - --tokenizer-revision
      - ${VL_REV:-cc594898137f460bfe9f0759e9844b3ce807cfb5}
      - --gpu-memory-utilization
      - "${VL2_MEM:-0.50}"
      - --max-model-len
      - "${VL_MAXLEN:-16384}"
      - --${VL_EAGER:-enforce-eager}
      - --max-num-seqs
      - "${VL_SEQS:-8}"
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  ocr2:
    image: python:3.11-slim@sha256:bab1b7ef4b450c81002278d035eff85ebe394ae94df904f7a3ba14f7e16e487b
    container_name: caso1v2e3e3-ocr2
    profiles: ["doble"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      vllm-vl2:
        condition: service_started
    environment:
      <<: *app-env
      VLLM_VL_URL: http://vllm-vl2:8000/v1
    volumes:
      - ./workers:/app
      - ${DATA_HOST:-/data/e3}:/data/e3:ro
    working_dir: /app
    command: >
      bash -c "
        pip install -q -r requirements.txt &&
        for i in $$(seq 1 ${OCR_WORKERS:-8}); do
          python -u ocr_worker.py &
        done &&
        wait
      "
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  #  NLP WORKERS - 12 workers (CPU)
  # ═══════════════════════════════════════════════════════════
  nlp:
    image: python:3.11-slim@sha256:bab1b7ef4b450c81002278d035eff85ebe394ae94df904f7a3ba14f7e16e487b
    container_name: caso1v2e3e3-nlp
    depends_on:
      rabbitmq:
        condition: service_healthy
      vllm:
        condition: service_started
    environment:
      <<: *app-env
    volumes:
      - ./workers:/app
    working_dir: /app
    command: >
      bash -c "
        pip install -q -r requirements.txt &&
        for i in {1..12}; do
          python -u nlp_worker.py &
        done &&
        wait
      "
    restart: unless-stopped
    deploy:
      replicas: 1

volumes:
  rabbit-data:
